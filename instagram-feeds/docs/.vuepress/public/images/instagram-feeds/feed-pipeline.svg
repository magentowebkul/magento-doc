-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" fill="#8b8f9a">gallery +</text><text x="824" y="112" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" fill="#8b8f9a">shoppable popup</text><path d="M464 128 v14" stroke="#f26322" stroke-width="1.4" stroke-dasharray="3 3"/><text x="464" y="159" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="600" fill="#f26322">you moderate</text><path d="M644 128 v14" stroke="#f26322" stroke-width="1.4" stroke-dasharray="3 3"/><text x="644" y="159" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" font-weight="600" fill="#f26322">you configure</text></svg>

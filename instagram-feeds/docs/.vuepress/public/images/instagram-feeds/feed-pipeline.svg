<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 176" width="928" height="176" role="img" aria-labelledby="pipelineTitle" color="#5c5f68"><title id="pipelineTitle">Posts travel from Instagram through sync into the media library, then into a feed and onto the storefront. You control the media library and the feed.</title><rect x="28" y="46" width="152" height="82" rx="16" fill="#8b8f9a" fill-opacity="0.07" stroke="#8b8f9a" stroke-opacity="0.35" stroke-width="1.5"/><text x="104" y="76" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="650" fill="currentColor">Instagram</text><text x="104" y="97" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" fill="#8b8f9a">posts, Reels,</text><text x="104" y="112" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" fill="#8b8f9a">carousels</text><path d="M188 87 H202" stroke="#8b8f9a" stroke-width="1.6" stroke-linecap="round"/><path d="m198 82 5 5-5 5" fill="none" stroke="#8b8f9a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="208" y="46" width="152" height="82" rx="16" fill="#8b8f9a" fill-opacity="0.07" stroke="#8b8f9a" stroke-opacity="0.35" stroke-width="1.5"/><text x="284" y="76" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="650" fill="currentColor">Sync</text><text x="284" y="97" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" fill="#8b8f9a">cron + queue,</text><text x="284" y="112" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" fill="#8b8f9a">mirrored locally</text><path d="M368 87 H382" stroke="#8b8f9a" stroke-width="1.6" stroke-linecap="round"/><path d="m378 82 5 5-5 5" fill="none" stroke="#8b8f9a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="388" y="46" widt